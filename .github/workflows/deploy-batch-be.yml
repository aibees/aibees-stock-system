# 배치 BE(py-stock-batch, 이미지 py-stock-batch) 배포 — 홈 서버
#   수동 실행만 한다. 배치 서버 안의 스케줄러(APScheduler)가 돌던 작업은 재시작하면 끊기므로
#   push 마다 자동으로 내리지 않는다. 배치가 돌지 않는 시간에 Actions 탭에서 실행한다.
#
#   옛 deploy_docker.sh 와 달리 컨테이너를 먼저 내리지 않는다.
#   새 이미지 빌드가 성공한 뒤에만 교체하므로 빌드가 깨지면 기존 서버가 그대로 남는다.
#   (메인 이미지는 aes.key/kis.key 를 COPY 로 굽는다 — 서버 clone 에 키 파일이 있어야 빌드된다)
#   설정 방법: .github/DEPLOY.md
name: 배포 · 배치 BE

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "지금 돌고 있는 배치 작업이 없는 것을 확인했나요?"
        type: boolean
        required: true
        default: false

concurrency:
  group: deploy-batch-be
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, home]
    timeout-minutes: 30
    env:
      ROOT: ${{ vars.HOME_DEPLOY_ROOT }}
      CONTAINER: stock-batch-flask-app
    steps:
      - name: 확인 체크
        if: ${{ !inputs.confirm }}
        run: |
          echo "::error::'돌고 있는 배치 작업이 없음' 체크 후 다시 실행하세요"
          exit 1

      - name: 배포 경로 확인
        run: |
          if [ -z "$ROOT" ] || [ ! -d "$ROOT/py-project/py-stock-batch" ]; then
            echo "::error::저장소 변수 HOME_DEPLOY_ROOT 가 비었거나 경로에 py-project/py-stock-batch 가 없습니다 ($ROOT)"
            exit 1
          fi

      - name: git pull
        run: |
          cd "$ROOT"
          git pull --ff-only origin main
          echo "커밋: $(git log -1 --format='%h %s')"

      - name: 이미지 빌드 (py-stock-batch)
        run: |
          cd "$ROOT/py-project"
          docker build -f py-stock-batch/Dockerfile -t py-stock-batch .

      - name: 컨테이너 교체
        run: |
          set -euo pipefail
          cd "$ROOT/py-project"
          proj="$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' "$CONTAINER" 2>/dev/null || true)"
          pargs=()
          [ -n "$proj" ] && pargs=(-p "$proj")
          docker compose "${pargs[@]}" -f py-stock-batch/docker-compose.yml up -d --force-recreate app

      - name: 헬스체크
        run: |
          sleep 15
          status="$(docker ps -a --filter "name=^/${CONTAINER}$" --format '{{.Status}}')"
          echo "· $CONTAINER: $status"
          case "$status" in
            Up*) ;;
            *) docker logs --tail 50 "$CONTAINER" 2>&1 || true
               echo "::error::$CONTAINER 기동 실패"; exit 1 ;;
          esac
          docker image prune -f >/dev/null 2>&1 || true
          echo "### 배치 BE 배포 완료 — $(git -C "$ROOT" log -1 --format='%h %s')" >> "$GITHUB_STEP_SUMMARY"

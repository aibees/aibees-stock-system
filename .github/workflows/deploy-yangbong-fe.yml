# 양봉상회 웹(yangbong-store-vue) 배포 — 클라우드 서버
#   main 에 yangbong-store-vue/ 가 바뀌어 push 되면 자동 배포, 수동 실행도 가능.
#   클라우드 서버의 기존 clone 에서 moveBuildFiles.sh 를 그대로 돌린다
#   (git pull → .env.prd 확인 → compose up --build → 헬스체크).
#   설정 방법: .github/DEPLOY.md
name: 배포 · 양봉상회 FE

on:
  push:
    branches: [main]
    paths:
      - "yangbong-store-vue/**"
      - "!yangbong-store-vue/ios/**"
      - "!yangbong-store-vue/**/*.md"
  workflow_dispatch:

concurrency:
  group: deploy-yangbong-fe
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, cloud]
    timeout-minutes: 20
    steps:
      - name: 배포 경로 확인
        env:
          ROOT: ${{ vars.CLOUD_DEPLOY_ROOT }}
        run: |
          if [ -z "$ROOT" ] || [ ! -d "$ROOT/yangbong-store-vue" ]; then
            echo "::error::저장소 변수 CLOUD_DEPLOY_ROOT 가 비었거나 경로에 yangbong-store-vue 가 없습니다 ($ROOT)"
            exit 1
          fi

      - name: 빌드·교체
        env:
          ROOT: ${{ vars.CLOUD_DEPLOY_ROOT }}
          BRANCH: main
        run: bash "$ROOT/yangbong-store-vue/moveBuildFiles.sh"

      - name: 배포된 커밋
        env:
          ROOT: ${{ vars.CLOUD_DEPLOY_ROOT }}
        run: |
          echo "### 양봉상회 FE 배포 완료 — $(git -C "$ROOT" log -1 --format='%h %s')" >> "$GITHUB_STEP_SUMMARY"

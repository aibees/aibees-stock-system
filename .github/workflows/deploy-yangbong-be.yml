# 양봉상회 BE(py-yangbong-api, 이미지 py-yangbong-web) 배포 — 홈 서버 (2026-11-19 deploy-web-be 에서 분리)
#   main 에 py-yangbong-api/ 또는 shared/ 가 바뀌어 push 되면 자동 배포, 수동 실행도 가능.
#
#   이미지 하나로 컨테이너 두 개:
#     yangbong-web-flask-app  (app)       — 서버에 이미 떠 있을 때만 교체
#     yangbong-training-worker (training-worker) — 서버에 이미 떠 있을 때만 교체(sql/yangbong/014 뒤 손으로 처음 기동)
#     yangbong-ai-worker      (ai-worker) — 서버에 이미 떠 있을 때만 교체. 교체 때 돌던 AI 호출이 끝나길 최대 160초 기다린다
#   아직 안 띄웠으면 이미지만 빌드하고 끝난다(sql 003 적용·시크릿·nginx 전환 같은 수동 단계가 먼저라서).
#
#   새 이미지 빌드가 성공한 뒤에만 교체하므로 빌드가 깨지면 기존 서버가 그대로 남는다.
#   설정 방법: .github/DEPLOY.md
name: 배포 · 양봉 BE

on:
  push:
    branches: [main]
    paths:
      - "py-project/py-yangbong-api/**"
      - "py-project/shared/**"
      - "py-project/.dockerignore"
      - "!py-project/**/*.md"
  workflow_dispatch:

concurrency:
  group: deploy-yangbong-be
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, home]
    timeout-minutes: 30
    env:
      ROOT: ${{ vars.HOME_DEPLOY_ROOT }}
    steps:
      - name: 배포 경로 확인
        run: |
          if [ -z "$ROOT" ] || [ ! -d "$ROOT/py-project/py-yangbong-api" ]; then
            echo "::error::저장소 변수 HOME_DEPLOY_ROOT 가 비었거나 경로에 py-project/py-yangbong-api 가 없습니다 ($ROOT)"
            exit 1
          fi

      - name: git pull
        run: |
          cd "$ROOT"
          git pull --ff-only origin main
          echo "커밋: $(git log -1 --format='%h %s')"

      - name: 이미지 빌드 (py-yangbong-web)
        run: |
          cd "$ROOT/py-project"
          # compose build 를 쓰지 않는다 — compose 는 env_file(.env.yangbong)이 없으면 빌드 전에 실패한다.
          # 양봉을 아직 띄우지 않은 서버에서도 shared/ 변경 때 이 워크플로가 깨지지 않게 이미지만 바로 만든다.
          docker build -f py-yangbong-api/Dockerfile -t py-yangbong-web .

      - name: 컨테이너 교체
        run: |
          set -euo pipefail
          cd "$ROOT/py-project"

          # 컨테이너가 떠 있으면 그 compose 프로젝트 이름을 그대로 쓴다(서버에서 손으로 띄울 때 쓴 이름과 맞춘다).
          project_of() { docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' "$1" 2>/dev/null || true; }

          # recreate <compose 파일> <서비스> <컨테이너 이름> <없을 때: start|skip>
          recreate() {
            local file="$1" svc="$2" name="$3" when_missing="$4" proj
            proj="$(project_of "$name")"
            if [ -z "$proj" ] && [ "$when_missing" = skip ]; then
              echo "· $name: 서버에 없음 → 건너뜀"
              return
            fi
            local pargs=()
            [ -n "$proj" ] && pargs=(-p "$proj")
            echo "· $name 교체 (project=${proj:-기본})"
            docker compose "${pargs[@]}" -f "$file" up -d --no-build --no-deps "$svc"
            echo "$name" >> "$RUNNER_TEMP/recreated.txt"
          }

          : > "$RUNNER_TEMP/recreated.txt"
          # 둘 다 서버에 이미 떠 있을 때만 교체한다 — 처음 기동은 sql·시크릿·nginx 준비 뒤 손으로(py-yangbong-api/docker-compose.yml 머리말).
          recreate py-yangbong-api/docker-compose.yml app       yangbong-web-flask-app skip
          recreate py-yangbong-api/docker-compose.yml ai-worker yangbong-ai-worker     skip
          recreate py-yangbong-api/docker-compose.yml training-worker yangbong-training-worker skip

      - name: 헬스체크
        run: |
          set -uo pipefail
          sleep 15
          fail=0
          while read -r name; do
            [ -z "$name" ] && continue
            status="$(docker ps -a --filter "name=^/${name}$" --format '{{.Status}}')"
            echo "· $name: $status"
            case "$status" in
              Up*) ;;
              *) fail=1; docker logs --tail 50 "$name" 2>&1 || true ;;
            esac
          done < "$RUNNER_TEMP/recreated.txt"
          rm -f "$RUNNER_TEMP/recreated.txt"
          docker image prune -f >/dev/null 2>&1 || true
          [ "$fail" = 0 ] || { echo "::error::기동 실패한 컨테이너가 있습니다"; exit 1; }
          echo "### 양봉 BE 배포 완료 — $(git -C "$ROOT" log -1 --format='%h %s')" >> "$GITHUB_STEP_SUMMARY"

# docker compose yml

version: "3.8"

services:
    app:
        #build:
        #    context: ..
        #    dockerfile: py-stock-batch/Dockerfile
        image: py-stock-batch
        container_name: stock-batch-flask-app
        working_dir: /workdir
        # 시크릿은 이 폴더의 .env(gitignored)에서 읽는다. .env.example 참고.
        #   JWT_SECRET_KEY  : 비밀상회 API(py-naver-stock-theme/.env)와 같은 값. 관리자 토큰 검증용.
        #   BATCH_ADMIN_KEY : (선택) 서버 안에서 curl 로 배치를 돌릴 때 X-Batch-Key 헤더로 보내는 키.
        env_file:
            - .env
        ports:
          - "5557:5557"
        environment:
            # 배치 시작/종료 push (job.py) 발송용 — FCM 서비스 계정 키 경로.
            - FCM_CREDENTIALS_PATH=/workdir/firebase-service-account.json
            # 배치 시작/종료 등 공통 운영 알림 수신자. 미설정이면 1.
            - COMMON_NOTIFY_USER_ID=1
        volumes:
            # 실제 키 파일은 aes.key/smtp.key 와 같은 위치(py-stock-batch/)에 두고
            # git 에는 올리지 않는다(.gitignore 참고).
            - ./firebase-service-account.json:/workdir/firebase-service-account.json:ro
        networks:
            aibees:
                ipv4_address: 172.21.1.5

networks:
    aibees:
        external: true
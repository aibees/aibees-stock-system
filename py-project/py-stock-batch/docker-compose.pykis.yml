      - NXT_LIMIT_SLIP_PCT=2.0    # 매수 지정가 = 전일종가 +2%
      - SELL_LIMIT_SLIP_PCT=1.0   # NXT 장외 매도 지정가 = 체결가 -1%
      - KIS_ALLOW_FILE_FALLBACK=false

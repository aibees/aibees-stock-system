      - NXT_BUY_TIME=08:00        # 프리마켓 08:00~08:50 (지정가만 가능)
      - NXT_LIMIT_SLIP_PCT=2.0    # 매수 지정가 = 전일종가 +2%
      - SELL_LIMIT_SLIP_PCT=1.0   # NXT 장외 매도 지정가 = 체결가 -1%
      - KIS_ALLOW_FILE_FALLBACK=false
      - DB_URL=mysql+pymysql://stock:stock123!!@210.183.63.247:3333/stock
      - FCM_CREDENTIALS_PATH=/workdir/firebase-service-account.json
#    networks: { aibees: { ipv4_address: 172.21.1.12 } }

  kis-user3:

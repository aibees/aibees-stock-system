# 양봉상회 API + AI 워커 (py-yangbong-api, 2026-11-19 py-secret-api 에서 분리).
#   이미지 py-yangbong-web 하나로 두 컨테이너를 띄운다 — app(gunicorn) · ai-worker(python -m app.workers.ai_job_worker).
#   비밀상회 API(py-secret-api, 이미지 py-stock-web)와는 이미지·DB 계정·JWT 키가 모두 다르다.
#
# 띄우기(py-project/ 에서):
#   docker compose -f py-yangbong-api/docker-compose.yml build app
#   docker compose -f py-yangbong-api/docker-compose.yml up -d
# 배포는 .github/workflows/deploy-yangbong-be.yml(떠 있을 때만 교체). **처음 한 번은 위 명령으로 직접 띄운다.**
#
# 처음 띄우기 전에(이 폴더 py-yangbong-api/ 기준):
#   1. DB: sql/yangbong/001~008 적용 — 특히 003(시장 데이터 뷰). 없으면 매수추천·차트·종목·업종이 모두 실패한다.
#   2. .env.yangbong          : DB_URL(yangbong 전용 계정) · JWT_SECRET_KEY(비밀상회와 **다른** 값). .env.yangbong.example 참고.
#   3. secrets/kis-yangbong.json : AI 워커 KIS 키 {id, account, app_key, sec_key}
#   4. Anthropic 키           : ../py-secret-api/app/config/keys/anthropic.env 를 마운트한다(비밀상회와 같은 키).
#      따로 쓰려면 아래 두 볼륨의 원본 경로만 바꾼다.
#   ※ 마운트할 파일이 없으면 docker 가 그 자리에 **빈 폴더**를 만들어 키를 못 읽는다 — 파일부터 둔다.
#
# 프로젝트 이름(name: yangbong) — 비밀상회 compose 와 서비스 이름(app)이 겹쳐도 서로 건드리지 않게 둔다.
#
# 외부 접속: 클라우드 nginx(저장소 밖 conf.d/stock-api.conf)가 홈서버 공개 포트로 들어온다.
#   비밀상회 API 5556 · 배치 5557 · 양봉상회 API 5558(→ 컨테이너 5556). 홈서버 방화벽·공유기에서 5558 을 열고,
#   클라우드 nginx 의 양봉상회 /api upstream 을 홈:5558 로 바꿔야 실제로 이 컨테이너가 요청을 받는다.
#
# aibees 네트워크(홈서버 172.21.0.0/16) 고정 IP: 172.21.1.8 (py-secret-api/docker-compose.yml 의 배정 현황 참고)
#
# ai-worker — AI 분석·재무 지표 작업 큐(stock_ai_job)를 처리하는 프로세스 1개.
#   설계: meetings/설계_2026-11-18_AI분석-비동기화.md · sql/yangbong/008.
#   KIS 를 부르는 곳은 이 컨테이너뿐이다(API 는 KIS 를 부르지 않는다).
#   받는 요청이 없으므로 포트·고정 IP 가 없다. 한 개만 띄운다(scale 금지 — KIS 토큰을 나눠 쓰지 않게).
#   DB 연결: API 최대 12 + 워커 최대 3 = 양봉 계정 한도 15.

name: yangbong-api

x-anthropic-key: &anthropic-key
    ../py-secret-api/app/config/keys/anthropic.env:/workdir/secrets/anthropic.env:ro

services:
    app:
        image: py-yangbong-web
        container_name: yangbong-web-flask-app
        working_dir: /workdir
        build:
            context: ..
            dockerfile: py-yangbong-api/Dockerfile
        pull_policy: never
        # 클라우드 nginx 가 홈서버 공개 포트로 접속한다(5556 은 비밀상회 API 가 쓴다)
        ports:
            - "5558:5556"
        env_file:
            - .env.yangbong
        environment:
            - TZ=Asia/Seoul
            - ANTHROPIC_ENV_FILE=/workdir/secrets/anthropic.env
            # yangbong 전용 계정은 MAX_USER_CONNECTIONS 15 (sql/yangbong/001). 워커 4개 × (2+1) = 최대 12.
            - DB_POOL_SIZE=2
            - DB_MAX_OVERFLOW=1
        volumes:
            - *anthropic-key
        logging:
            driver: json-file
            options:
                max-size: "20m"
                max-file: "5"
        networks:
            aibees:
                ipv4_address: 172.21.1.8
        restart: unless-stopped

    ai-worker:
        image: py-yangbong-web
        container_name: yangbong-ai-worker
        working_dir: /workdir
        pull_policy: never
        command: ["poetry", "run", "python", "-m", "app.workers.ai_job_worker"]
        env_file:
            - .env.yangbong
        environment:
            - TZ=Asia/Seoul
            - ANTHROPIC_ENV_FILE=/workdir/secrets/anthropic.env
            - KIS_CREDS_FILE=/workdir/secrets/kis-yangbong.json
            - FCM_CREDENTIALS_PATH=/workdir/secrets/firebase-service-account.json
            - DB_POOL_SIZE=1
            - DB_MAX_OVERFLOW=2
        volumes:
            - *anthropic-key
            - ./secrets/kis-yangbong.json:/workdir/secrets/kis-yangbong.json:ro
            - ../py-stock-batch/firebase-service-account.json:/workdir/secrets/firebase-service-account.json:ro
            # pykis 토큰 캐시(~/.pykis) — 재시작해도 24시간 토큰을 다시 받지 않게(발급 1분 1회 제한)
            - yangbong-pykis-cache:/root/.pykis
        # SIGTERM 뒤 진행 중 AI 호출이 끝나길 기다린다(워커 STOP_GRACE_SECONDS 150)
        stop_grace_period: 160s
        logging:
            driver: json-file
            options:
                max-size: "20m"
                max-file: "5"
        networks:
            - aibees
        restart: unless-stopped

volumes:
    yangbong-pykis-cache:

networks:
    aibees:
        external: true

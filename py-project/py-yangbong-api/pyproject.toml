[tool.poetry]
name = "yangbong_api"
version = "0.1.0"
description = "양봉상회 API + AI 워커 (2026-11-19 py-secret-api 에서 분리)"
authors = ["aibees <aibees1129@naver.com>"]
# 패키지로 배포하지 않는다(앱 코드는 이미지에 그대로 복사) — poetry 가 app/ 를 설치 대상으로 찾지 않게.
package-mode = false

[tool.poetry.dependencies]
python = "^3.12.3"
# stock_shared(DB 계층) + web_shared(웹 공용) — 둘 다 ../shared 에 있다
stock-shared = { path = "../shared", develop = true }
sqlalchemy = "^2.0.41"
pymysql = "^1.1.1"
requests = "^2.32.3"
flask = "^3.1.1"
flask-cors = "^6.0.1"
pandas = "^2.3.0"
python-dotenv = "^1.1.0"
gunicorn = "^23.0.0"
gevent = "^24.11.1"
simplejson = "^3.20.2"
PyJWT = "^2.8.0"
anthropic = "^0.105.2"
pydantic-settings = "^2.14.1"
yfinance = "^1.5.2"
# AI 워커만 쓴다 — KIS 재무·뉴스 조회(web_shared KisEngine), 완료 알림 푸시(stock_shared.push.fcm)
python-kis = "^2.1.6"
firebase-admin = "^6.5.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

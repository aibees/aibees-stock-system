# 양봉상회 API — 비밀상회 API(docker-compose.yml)와 같은 이미지(py-stock-web), 설정만 다르다.
#
#   APP_SERVICE=yangbong : 공개용 블루프린트만 등록(배치·전략·매매·공통코드 관리 없음),
#                          API 는 KIS 를 쓰지 않음(차트·추천 기록은 DB 일봉). 재무·뉴스·AI 분석은 아래 ai-worker 가 만든다.
#   .env.yangbong        : DB_URL(yangbong 전용 계정, sql/yangbong/001) · JWT_SECRET_KEY(비밀상회와 **다른** 값).
#                          .env.yangbong.example 참고. gitignored, 이미지에도 안 들어간다.
#
# 띄우기(py-project/ 에서 이미지를 먼저 빌드했다면):
#   docker compose -f py-naver-stock-theme/docker-compose.yangbong.yml up -d
# 아직 nginx 가 이 컨테이너로 보내지 않는다 — 양봉상회 웹의 /api 프록시를 yangbong-web-flask-app:5556 으로 바꿔야 한다
# (도메인 결정 후, yangbong-store-vue/conf.d/http.conf).
#
# aibees 네트워크 고정 IP: 172.21.1.8 (docker-compose.yml 의 배정 현황 참고)
#
# ai-worker (2026-11-18) — AI 분석·재무 지표 작업 큐(stock_ai_job)를 처리하는 프로세스 1개. 같은 이미지.
#   설계: meetings/설계_2026-11-18_AI분석-비동기화.md · 먼저 sql/yangbong/008 적용.
#   KIS 를 부르는 곳은 이 컨테이너뿐이다(KIS_ENABLED=true, 키는 kis-yangbong.json 마운트 — {id, account, app_key, sec_key}).
#   완료 알림 푸시는 firebase-service-account.json(py-stock-batch 와 같은 파일)을 마운트한다.
#   받는 요청이 없으므로 포트·고정 IP 가 없다. 한 개만 띄운다(scale 금지 — KIS 토큰을 나눠 쓰지 않게).
#   DB 연결: API 최대 12 + 워커 최대 3 = 양봉 계정 한도 15.

services:
    app:
        image: py-stock-web
        container_name: yangbong-web-flask-app
        working_dir: /workdir
        build:
            context: ..
            dockerfile: py-naver-stock-theme/Dockerfile
        pull_policy: never
        env_file:
            - .env.yangbong
        environment:
            - TZ=Asia/Seoul
            - APP_SERVICE=yangbong
            # yangbong 전용 계정은 MAX_USER_CONNECTIONS 15 (sql/yangbong/001). 워커 4개 × (2+1) = 최대 12.
            - DB_POOL_SIZE=2
            - DB_MAX_OVERFLOW=1
        logging:
            driver: json-file
            options:
                max-size: "20m"
                max-file: "5"
        networks:
            aibees:
                ipv4_address: 172.21.1.8
        restart: unless-stopped

    ai-worker:
        image: py-stock-web
        container_name: yangbong-ai-worker
        working_dir: /workdir
        pull_policy: never
        command: ["poetry", "run", "python", "-m", "app.workers.ai_job_worker"]
        env_file:
            - .env.yangbong
        environment:
            - TZ=Asia/Seoul
            - APP_SERVICE=yangbong
            - KIS_ENABLED=true
            - KIS_CREDS_FILE=/workdir/secrets/kis-yangbong.json
            - FCM_CREDENTIALS_PATH=/workdir/secrets/firebase-service-account.json
            - DB_POOL_SIZE=1
            - DB_MAX_OVERFLOW=2
        volumes:
            - ./secrets/kis-yangbong.json:/workdir/secrets/kis-yangbong.json:ro
            - ../py-stock-batch/firebase-service-account.json:/workdir/secrets/firebase-service-account.json:ro
            # pykis 토큰 캐시(~/.pykis) — 재시작해도 24시간 토큰을 다시 받지 않게(발급 1분 1회 제한)
            - yangbong-pykis-cache:/root/.pykis
        # SIGTERM 뒤 진행 중 AI 호출이 끝나길 기다린다(워커 STOP_GRACE_SECONDS 150)
        stop_grace_period: 160s
        logging:
            driver: json-file
            options:
                max-size: "20m"
                max-file: "5"
        networks:
            - aibees
        restart: unless-stopped

volumes:
    yangbong-pykis-cache:

networks:
    aibees:
        external: true

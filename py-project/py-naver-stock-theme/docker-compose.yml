# py-stock-web — Flask API 전용 compose
#
# 이미지는 build_docker.sh 가 py-project/ 컨텍스트에서 미리 빌드한다(py-stock-web).
# MCP 서버는 여기가 아니라 docker-compose.mcp.yml + run_docker_mcp.sh 로 따로 운영한다.
#
# aibees 네트워크 고정 IP 배정 현황(중복 금지):
#   172.21.1.4  stock-web-flask-app   (이 파일)
#   172.21.1.5  stock-batch-flask-app (py-stock-batch/docker-compose.yml)
#   172.21.1.6  stock-vue-app         (stock-vue/docker-compose.yml)
#   172.21.1.7  stock-web-mcp-server  (docker-compose.mcp.yml)
#   172.21.1.11 kis-user1             (py-stock-batch/docker-compose.pykis.yml)

services:
    app:
        image: py-stock-web
        container_name: stock-web-flask-app
        working_dir: /workdir
        # build 를 명시해야 로컬에 이미지가 없을 때 compose 가 **직접 빌드**한다.
        #   없으면 compose 는 레지스트리에서 pull 을 시도하고,
        #   py-stock-web 은 로컬 전용 태그라 이렇게 끝난다:
        #     pull access denied for py-stock-web, repository does not exist
        #   (구 build_docker.sh 가 rmi 로 이미지를 먼저 지우는 바람에 실제로 발생)
        #
        # context 는 .. = py-project/ 여야 한다. shared 가 컨텍스트에 포함되어야
        # poetry 의 path dependency('../shared')가 해석된다.
        build:
            context: ..
            dockerfile: py-naver-stock-theme/Dockerfile

        # 로컬 빌드 이미지라 레지스트리 조회를 아예 막는다.
        # 이미지가 없으면 pull 실패가 아니라 build 로 넘어간다.
        pull_policy: never

        # nginx 는 같은 aibees 네트워크에서 172.21.1.4:5556 으로 붙지만,
        # 호스트 포트도 열어둔다. 배포 직후 컨테이너 밖에서 바로 확인할 수 있어야
        # "떴는데 응답이 없다" 를 네트워크 문제와 앱 문제로 나눌 수 있다.
        ports:
            - "5556:5556"

        environment:
            # 컨테이너 기본 TZ 는 UTC. 로그·스케줄 시각을 KST 로 맞춘다.
            - TZ=Asia/Seoul
        # 로그 무제한 증가 방지. gunicorn access log 를 켰기 때문에 더 필요하다.
        logging:
            driver: json-file
            options:
                max-size: "20m"
                max-file: "5"
        networks:
            aibees:
                ipv4_address: 172.21.1.4
        restart: unless-stopped

networks:
    aibees:
        external: true

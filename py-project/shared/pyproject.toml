[tool.poetry]
name = "stock-shared"
version = "0.1.0"
description = "py-naver-stock-theme / py-stock-batch 공용 ORM 모델 및 DAO"
readme = "README.md"
authors = ["aibees <aibees1129@naver.com>"]
packages = [{ include = "stock_shared" }]

[tool.poetry.dependencies]
python = "^3.12"
SQLAlchemy = "*"
# stock_shared.kis 전용. client 가 함수 안에서 지연 import 하므로 import 만으로는 필요 없지만,
# create_pykis 를 쓰는 두 앱이 모두 같은 버전(2.1.6)을 고정하고 있다.
python-kis = "^2.1.6"
# stock_shared.ml.shape_model 전용 선택 의존성. shape_features 는 이 없이도 동작한다.
scikit-learn = "1.9.1"
joblib = "1.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

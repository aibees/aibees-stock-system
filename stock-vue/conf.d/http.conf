http {

    include       /etc/nginx/mime.types;
    default_type  application/json;

    log_format    main  '$remote_addr - $remote_user [$time_local] host:"$host" "$request" '
                        '$status $body_bytes_sent "$http_referer" $http_origin'
                        '"$http_user_agent" "$http_x_forwarded_for"';

    access_log   /var/log/nginx/access.log    main;

    sendfile            on;
    keepalive_timeout   65;

    server {
        listen 5556;

        index index.html;
        root /usr/share/nginx/html;

        server_name stock.aibeesworld.com;

        # RFC 8414 OAuth discovery — mcp-remote가 토큰 없이 접근하는 경로
#        location = /.well-known/oauth-authorization-server {
#            proxy_pass         http://stock-web-mcp-server:5558;
#
#            proxy_http_version 1.1;
#            proxy_set_header   Host              $host;
#            proxy_set_header   X-Real-IP         $remote_addr;
#            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
#            proxy_set_header   X-Forwarded-Proto $scheme;
#        }

#        location ^~ /mcp {
#            proxy_pass         http://stock-web-mcp-server:5558;
#
#            proxy_http_version 1.1;
#            proxy_set_header   Host              $host;
#            proxy_set_header   X-Real-IP         $remote_addr;
#            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
#            proxy_set_header   X-Forwarded-Proto $scheme;
#
#            # Streamable HTTP — 버퍼링 OFF, 타임아웃 길게
#            proxy_buffering    off;
#            proxy_cache        off;
#            proxy_read_timeout 3600s;
#            proxy_send_timeout 3600s;
#            chunked_transfer_encoding on;
#        }

        location ^~ /api/v1/jobs {
            proxy_pass http://stock-batch-flask-app:5557/api/v1/jobs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 매도 수기등록 — py-stock-batch 자체 API (batchApi).
        #
        # ⚠ 2026-10-11 까지 이 블록은 `^~ /api/v1/auto-trade` 였다. 그런데 ROOT 앱
        #   (stock-web-flask-app)도 같은 prefix 에 blueprint 를 등록한다
        #   (운용모드 /modes·/state·/history). `^~` 는 아래 `^~ /api/` 보다 우선하므로
        #   /api/v1/auto-trade/* 전체가 batch 앱으로 가버려, ROOT 의 그 3개가 404 가 되고
        #   앱의 "운용방식 설정"·"운용 현황" 화면이 통째로 죽었다. 매도 수기등록만
        #   멀쩡해서(이 앱에 있으니) 원인이 서버 장애처럼 보이지 않았다.
        #   → batch 쪽 prefix 를 /api/v1/manual-sell 로 분리해 prefix 가 겹치지 않게 했다.
        #     이제 /api/v1/auto-trade 는 아래 `^~ /api/` 를 타고 ROOT 로 간다.
        location ^~ /api/v1/manual-sell {
            proxy_pass http://stock-batch-flask-app:5557/api/v1/manual-sell;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 푸시 디바이스 토큰 등록/해제 (usePushNotifications.js) — 위와 동일 패턴.
        location ^~ /api/v1/notify {
            proxy_pass http://stock-batch-flask-app:5557/api/v1/notify;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location ^~ /api/ {
            proxy_pass http://stock-web-flask-app:5556/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }


        location / {
            allow 101.101.219.206;

            try_files $uri $uri/ @rewrites;
        }

        location @rewrites {
            rewrite ^(.+)$ /index.html last;
        }

    }
}

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="감이 아니라, 기준으로. 내 성향에 맞는 종목과 그 이유를 쉬운 말로 확인하는 앱, 양봉상회." />
    <link rel="canonical" href="https://yangbong.chagoklabs.com/" />

    <!-- Open Graph / 트위터 카드. 공유 미리보기 봇은 JS 를 실행하지 않아서 모든 경로(/privacy 등)가 이 값을 쓴다.
         og-image.png(1200×630)는 public/ 에 있고, 크롤러가 받을 수 있게 절대 주소로 적는다. 이미지를 바꾸면 ?v= 를 올려 캐시를 끊는다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="양봉상회" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="https://yangbong.chagoklabs.com/" />
    <meta property="og:title" content="양봉상회 — 감이 아니라, 기준으로" />
    <meta property="og:description" content="내 성향에 맞는 종목과 그 이유를 쉬운 말로 확인하세요. AI 분석과 차트 공부까지 한 앱에서." />
    <meta property="og:image" content="https://yangbong.chagoklabs.com/og-image.png?v=1" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="양봉상회 — 감이 아니라, 기준으로. 내 성향에 맞는 종목을 한곳에서" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="양봉상회 — 감이 아니라, 기준으로" />
    <meta name="twitter:description" content="내 성향에 맞는 종목과 그 이유를 쉬운 말로 확인하세요. AI 분석과 차트 공부까지 한 앱에서." />
    <meta name="twitter:image" content="https://yangbong.chagoklabs.com/og-image.png?v=1" />
    <!-- 글꼴은 yangbong-store-vue 와 같은 Pretendard(public/fonts/pretendard, 외부 CDN 없음) -->
    <link rel="stylesheet" href="/fonts/pretendard/pretendard.css" />
    <title>양봉상회</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

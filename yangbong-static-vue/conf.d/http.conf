http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 클라우드 호스트 nginx 를 거쳐 들어오므로 remote_addr 는 docker 게이트웨이(172.23.0.1).
    # 실제 사용자 IP 는 X-Forwarded-For 에서 꺼낸다.
    set_real_ip_from  172.23.0.0/16;
    real_ip_header    X-Forwarded-For;

    log_format    main  '$remote_addr - $remote_user [$time_local] host:"$host" "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';
    access_log   /var/log/nginx/access.log    main;

    sendfile            on;
    keepalive_timeout   65;

    # 정적 파일만 서빙한다(API 없음). 새로고침해도 /privacy 등이 열리도록 index.html 로 돌린다.
    server {
        listen 5557;
        root  /usr/share/nginx/html;
        index index.html;

        # 빌드 산출물(해시 파일명)은 오래 캐시
        location ^~ /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # index.html 은 매번 새로 받아야 배포가 바로 반영된다
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}

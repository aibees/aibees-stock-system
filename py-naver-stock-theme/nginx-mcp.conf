# stock.aibeesworld.com — MCP 서버 라우팅 추가
# 기존 server 블록에 아래 location 블록들을 추가하세요.

# ── MCP 엔드포인트 ──────────────────────────────────────────
# Streamable HTTP는 long-lived connection + 청크 응답을 사용하므로
# 버퍼링 OFF, 타임아웃을 충분히 길게 설정합니다.
location /mcp {
    proxy_pass         http://172.21.1.5:5558/mcp;

    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Streaming 필수 설정
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 3600s;   # tool 실행 중 연결 유지
    proxy_send_timeout 3600s;
    chunked_transfer_encoding on;
}

# ── OAuth 엔드포인트 ────────────────────────────────────────
location /oauth/ {
    proxy_pass         http://172.21.1.5:5558/oauth/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

# ── OAuth Discovery (RFC 8414) ──────────────────────────────
location /.well-known/oauth-authorization-server {
    proxy_pass         http://172.21.1.5:5558/.well-known/oauth-authorization-server;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-Proto $scheme;
}
